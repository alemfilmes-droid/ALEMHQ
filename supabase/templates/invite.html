<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#0A0A0A;font-family:Inter,Arial,sans-serif;color:#F0F0F0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0A0A0A;padding:48px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;background:#111111;border:1px solid #2A2A2A;">
            <tr>
              <td style="padding:40px;">
                <p style="margin:0 0 24px;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#A3A3A3;font-weight:700;">Além HQ</p>
                <h1 style="margin:0 0 16px;font-size:24px;line-height:1.2;font-weight:900;color:#F0F0F0;">Seu acesso está pronto.</h1>
                <p style="margin:0 0 32px;font-size:15px;line-height:1.6;color:#A3A3A3;">
                  A Além Filmes convidou você para o Além HQ. Defina seu nome e sua senha para entrar.
                </p>
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite&next=/aceitar-convite"
                   style="display:inline-block;background:#F0F0F0;color:#0A0A0A;text-decoration:none;font-weight:600;font-size:15px;padding:14px 24px;">
                  Aceitar convite
                </a>
                <p style="margin:32px 0 0;font-size:13px;line-height:1.6;color:#6B6B6B;">
                  O link expira em breve. Se ele não funcionar, peça um novo convite a quem administra o sistema.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
